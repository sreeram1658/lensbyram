<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens by Ram — Photography by Sreeram R</title>
<meta name="description" content="Photography by Sreeram R — wildlife, people and landscapes from India.">
<style>
:root{--bg:#0b0b0b;--fg:#f2f2f2;--muted:#9a9a9a;--h:300px;--gap:6px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

header{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:22px 32px;z-index:10;transition:background .3s}
header.solid{background:rgba(11,11,11,.85);backdrop-filter:blur(10px)}
.logo{font-size:13px;letter-spacing:4px;text-transform:uppercase}
header nav a{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#ccc;margin-left:24px}
header nav a:hover{color:#fff}

.hero{position:relative;height:100vh;height:100svh;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,0) 40%,rgba(0,0,0,.75))}
.hero-text{position:absolute;left:32px;right:32px;bottom:56px;z-index:1}
.hero h1{font-size:clamp(2.4rem,7vw,5.5rem);font-weight:800;letter-spacing:-1.5px;line-height:.95}
.hero p{margin-top:14px;font-size:clamp(.9rem,1.6vw,1.1rem);color:#d6d6d6;letter-spacing:.5px}
.hero .cue{display:inline-block;margin-top:28px;font-size:12px;letter-spacing:3px;text-transform:uppercase;border-bottom:1px solid #fff;padding-bottom:6px}

main{padding:80px var(--gap) 40px}
.grid{display:flex;flex-wrap:wrap;gap:var(--gap)}
.grid::after{content:"";flex-grow:1000000}
.ph{position:relative;display:block;overflow:hidden;background:#1a1a1a center/cover no-repeat;cursor:zoom-in}
.ph i{display:block}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease,transform .6s ease}
.ph img.on{opacity:1}
.ph:hover img{transform:scale(1.03)}

footer{text-align:center;padding:60px 20px;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase}
footer a:hover{color:var(--fg)}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;z-index:100}
.lb.open{display:flex}
.lb img{max-width:94vw;max-height:86vh;object-fit:contain;user-select:none;transition:opacity .25s}
.lb button{position:absolute;background:none;border:0;color:#fff;font-size:30px;padding:16px 22px;cursor:pointer;opacity:.6}
.lb button:hover{opacity:1}
.lb .x{top:8px;right:8px;font-size:24px}
.lb .prev{left:8px;top:50%;transform:translateY(-50%)}
.lb .next{right:8px;top:50%;transform:translateY(-50%)}
.lb .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}

@media (max-width:768px){
  :root{--h:170px;--gap:4px}
  header{padding:16px 18px}
  .hero-text{left:18px;right:18px;bottom:40px}
  .lb .prev,.lb .next{display:none}
}
</style>
</head>
<body>

<header id="hdr">
  <a href="#" class="logo">Lens by Ram</a>
  <nav>
    <a href="#work">Work</a>
    <a href="https://instagram.com/lens.by.ram" target="_blank" rel="noopener">Instagram</a>
  </nav>
</header>

<section class="hero">
  <!-- change hero photo: use any id from photos.json -->
  <img src="full/parakeet.webp" alt="Parakeet" fetchpriority="high">
  <div class="hero-text">
    <h1>Sreeram R</h1>
    <p>Nikongrapher · Data Analyst · Visual Storyteller — Chennai / Palakkad, India</p>
    <a href="#work" class="cue">View work ↓</a>
  </div>
</section>

<main id="work"><div class="grid" id="grid"></div></main>

<footer>© <span id="yr"></span> Sreeram R · <a href="https://instagram.com/lens.by.ram" target="_blank" rel="noopener">Instagram</a></footer>

<div class="lb" id="lb">
  <button class="x" aria-label="Close">✕</button>
  <button class="prev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="next" aria-label="Next">›</button>
  <div class="cap" id="lbCap"></div>
</div>

<script>
const grid = document.getElementById('grid');
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbCap = document.getElementById('lbCap');
let photos = [], cur = 0;

document.getElementById('yr').textContent = new Date().getFullYear();

// header background on scroll
const hdr = document.getElementById('hdr');
addEventListener('scroll', () => hdr.classList.toggle('solid', scrollY > 80), { passive: true });

// build justified grid
fetch('photos.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(data => {
    photos = data;
    const frag = document.createDocumentFragment();
    data.forEach((p, i) => {
      const r = p.w / p.h;
      const a = document.createElement('a');
      a.className = 'ph';
      a.href = `full/${p.id}.webp`;
      a.style.flexGrow = r * 100;
      a.style.flexBasis = `calc(var(--h) * ${r})`;
      a.style.backgroundImage = `url(${p.lqip})`;

      const pad = document.createElement('i');
      pad.style.paddingBottom = `${100 / r}%`;

      const img = new Image();
      img.loading = 'lazy';
      img.decoding = 'async';
      img.width = p.w;
      img.height = p.h;
      img.alt = p.title;
      img.onload = () => img.classList.add('on');
      img.src = `thumbs/${p.id}.webp`;

      a.append(pad, img);
      a.addEventListener('click', e => { e.preventDefault(); openLb(i); });
      frag.append(a);
    });
    grid.append(frag);
  });

// lightbox
function show(i) {
  cur = (i + photos.length) % photos.length;
  const p = photos[cur];
  lbImg.style.opacity = .3;
  lbImg.onload = () => lbImg.style.opacity = 1;
  lbImg.src = `full/${p.id}.webp`;
  lbImg.alt = p.title;
  lbCap.textContent = `${p.title}  ·  ${cur + 1} / ${photos.length}`;
  [1, -1].forEach(d => { new Image().src = `full/${photos[(cur + d + photos.length) % photos.length].id}.webp`; });
}
function openLb(i) { show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; lbImg.removeAttribute('src'); }

lb.querySelector('.x').onclick = closeLb;
lb.querySelector('.prev').onclick = () => show(cur - 1);
lb.querySelector('.next').onclick = () => show(cur + 1);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});

let tx = 0;
lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
});
</script>
</body>
</html>
