<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens by Ram — Photography by Sreeram R</title>
<meta name="description" content="Photography by Sreeram R — wildlife, people and landscapes from India.">
<style>
:root{--bg:#fff;--fg:#111;--muted:#767676;--chip:#efefef;--chip-on:#111;--gap:16px;--cols:5;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f2f2f2;--muted:#9a9a9a;--chip:#2a2a2a;--chip-on:#f2f2f2}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:20px;padding:12px 20px}
.logo{font-weight:800;font-size:18px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
.chips::-webkit-scrollbar{display:none}
.chips button{border:0;background:var(--chip);color:var(--fg);font-size:14px;font-weight:600;font-family:inherit;padding:10px 16px;border-radius:24px;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--chip-on);color:var(--bg)}
header .ig{font-size:14px;font-weight:600;white-space:nowrap}
.intro{padding:24px 20px 8px;text-align:center}
.intro h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800}
.intro p{margin-top:8px;color:var(--muted);font-size:15px}
main{padding:16px 16px 40px}
.grid{column-count:var(--cols);column-gap:var(--gap)}
.pin{break-inside:avoid;margin-bottom:var(--gap);position:relative;display:block;border-radius:var(--r);overflow:hidden;cursor:zoom-in;background:var(--chip) center/cover no-repeat}
.pin i{display:block}
.pin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.pin img.on{opacity:1}
.pin .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 45%);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;padding:12px;color:#fff;font-size:13px;font-weight:600}
.pin:hover .ov{opacity:1}
footer{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
footer a:hover{color:var(--fg)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:100}
.lb.open{display:flex}
.lb img{max-width:94vw;max-height:86vh;object-fit:contain;user-select:none;border-radius:8px;transition:opacity .25s}
.lb button{position:absolute;background:none;border:0;color:#fff;font-size:30px;padding:16px 22px;cursor:pointer;opacity:.6}
.lb button:hover{opacity:1}
.lb .x{top:8px;right:8px;font-size:24px}
.lb .prev{left:8px;top:50%;transform:translateY(-50%)}
.lb .next{right:8px;top:50%;transform:translateY(-50%)}
.lb .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:13px;color:#aaa}
@media (max-width:1400px){:root{--cols:4}}
@media (max-width:1000px){:root{--cols:3}}
@media (max-width:640px){:root{--cols:2;--gap:8px;--r:12px}header{padding:10px 12px;gap:10px}header .ig{display:none}main{padding:8px}.lb .prev,.lb .next{display:none}}
</style>
</head>
<body>

<header>
  <a href="#" class="logo">Lens by Ram</a>
  <nav class="chips" id="chips"></nav>
  <a class="ig" href="https://instagram.com/lens.by.ram" target="_blank" rel="noopener">Instagram</a>
</header>

<section class="intro">
  <h1>Sreeram R</h1>
  <p>Nikongrapher · Data Analyst · Visual Storyteller — Chennai / Palakkad, India</p>
</section>

<main id="work"><div class="grid" id="grid"></div></main>

<footer>© <span id="yr"></span> Sreeram R · <a href="https://instagram.com/lens.by.ram" target="_blank" rel="noopener">Instagram</a></footer>

<div class="lb" id="lb">
  <button class="x" aria-label="Close">✕</button>
  <button class="prev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="next" aria-label="Next">›</button>
  <div class="cap" id="lbCap"></div>
</div>

<script>
const grid = document.getElementById('grid');
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbCap = document.getElementById('lbCap');
let photos = [], cur = 0;

document.getElementById('yr').textContent = new Date().getFullYear();

const LABELS = { all: 'All', birds: 'Birds', wildlife: 'Wildlife & Macro', people: 'People', football: 'Football', landscapes: 'Landscapes', sky: 'Sky', places: 'Places' };
let all = [], cat = 'all';
const chips = document.getElementById('chips');

function render() {
  photos = cat === 'all' ? all : all.filter(p => p.category === cat);
  grid.textContent = '';
  const frag = document.createDocumentFragment();
  photos.forEach((p, i) => {
    const r = p.w / p.h;
    const a = document.createElement('a');
    a.className = 'pin';
    a.href = `full/${p.id}.webp`;
    a.style.backgroundImage = `url(${p.lqip})`;
    const pad = document.createElement('i');
    pad.style.paddingBottom = `${100 / r}%`;
    const img = new Image();
    img.loading = 'lazy'; img.decoding = 'async';
    img.width = p.w; img.height = p.h; img.alt = p.title;
    img.onload = () => img.classList.add('on');
    img.src = `thumbs/${p.id}.webp`;
    const ov = document.createElement('span');
    ov.className = 'ov'; ov.textContent = p.title;
    a.append(pad, img, ov);
    a.addEventListener('click', e => { e.preventDefault(); openLb(i); });
    frag.append(a);
  });
  grid.append(frag);
  [...chips.children].forEach(b => b.classList.toggle('on', b.dataset.c === cat));
}

fetch('photos.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(data => {
    all = data;
    Object.keys(LABELS).forEach(c => {
      if (c !== 'all' && !data.some(p => p.category === c)) return;
      const b = document.createElement('button');
      b.dataset.c = c; b.textContent = LABELS[c];
      b.onclick = () => { cat = c; render(); scrollTo(0, 0); };
      chips.append(b);
    });
    render();
  });

// lightbox
function show(i) {
  cur = (i + photos.length) % photos.length;
  const p = photos[cur];
  lbImg.style.opacity = .3;
  lbImg.onload = () => lbImg.style.opacity = 1;
  lbImg.src = `full/${p.id}.webp`;
  lbImg.alt = p.title;
  lbCap.textContent = `${p.title}  ·  ${cur + 1} / ${photos.length}`;
  [1, -1].forEach(d => { new Image().src = `full/${photos[(cur + d + photos.length) % photos.length].id}.webp`; });
}
function openLb(i) { show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; lbImg.removeAttribute('src'); }

lb.querySelector('.x').onclick = closeLb;
lb.querySelector('.prev').onclick = () => show(cur - 1);
lb.querySelector('.next').onclick = () => show(cur + 1);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});

let tx = 0;
lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
});
</script>
</body>
</html>
